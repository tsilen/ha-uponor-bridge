name: Uponor Bridge
version: "1.0.0"
slug: uponor_bridge
url: https://github.com/tsilen/ha-uponor-bridge
description: Read-only Uponor Smatrix/X-145 RS485 bus listener that publishes thermostat values to MQTT (HA discovery).
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
uart: true
services:
  - mqtt:need
options:
  serial_port: /dev/serial/by-id/usb-FTDI_FT232R_USB_UART_BG03WKE3-if00-port0
schema:
  serial_port: device(subsystem=tty)
